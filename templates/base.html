{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>{% block title %}SkedIt.AI{% endblock %}</title>
  <script>
    if (window.self !== window.top) {
      document.documentElement.style.display = 'none';
      window.top.location.reload();
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            uniGreen: "#2F6B2F",
            uniGold: "#F2B705",
          },
          boxShadow: {
            soft: "0 10px 30px rgba(0,0,0,0.08)",
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    html,
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      height: 100%;
      margin: 0;
    }

    /* The outer shell fills viewport naturally */
    #app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Main area: grows with content */
    #app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800" x-data="{ sidebarOpen: false }">
  
  <!-- Mobile Sidebar Backdrop -->
  <div x-show="sidebarOpen" x-transition.opacity x-cloak
       class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm lg:hidden"
       @click="sidebarOpen = false"></div>

  <div id="app-shell">
    <!-- Sidebar -->
    <div id="app-sidebar" 
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
         class="fixed lg:sticky top-0 left-0 z-50 h-screen w-72 bg-white border-r border-slate-100 shadow-2xl lg:shadow-none flex flex-col flex-shrink-0 transition-transform duration-300 overflow-y-auto overflow-x-hidden">
      {% include "partials/sidebar.html" %}
    </div>

    <!-- Main Content Wrapper -->
    <div id="app-main">
      {% include "partials/topbar.html" %}
      <main class="px-4 sm:px-6 lg:px-10 py-6 flex-1 w-full max-w-[100vw] lg:max-w-none">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  {% include "partials/toasts.html" %}

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</body>

</html>
